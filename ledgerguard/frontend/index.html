<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LedgerGuard</title>
<style>
  :root {
    --bg: #0d1117; --panel: #151b23; --panel2: #1c232c; --line: #2a323d;
    --text: #e6edf3; --muted: #8b949e;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.02em; }
  h2 { font-size: 15px; margin: 0 0 14px; text-transform: uppercase;
       letter-spacing: .09em; color: var(--muted); font-weight: 600; }
  .tag { font: 600 11px/1 var(--mono); padding: 4px 7px; border-radius: 4px;
         display: inline-block; white-space: nowrap; }
  .MATCHED { background: #1a2f1f; color: var(--ok); }
  .AUTO_RESOLVED { background: #12283a; color: var(--accent); }
  .RECOMMEND_REVIEW, .HUMAN_REVIEW_REQUIRED, .UNRESOLVED { background: #3a2a12; color: var(--warn); }
  .VERIFIED { background: #1a2f1f; color: var(--ok); }
  .REJECTED { background: #3a1a1a; color: var(--bad); }
  .UNVERIFIED { background: #3a2a12; color: var(--warn); }
  section { margin-bottom: 34px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .stat { padding: 13px 15px; }
  .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase;
             letter-spacing: .07em; margin-bottom: 5px; }
  .stat .v { font: 600 20px/1.2 var(--mono); }
  .stat .v.good { color: var(--ok); } .stat .v.warn { color: var(--warn); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 8px 11px; border-bottom: 1px solid var(--line);
           vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: .07em; }
  tbody tr:last-child td { border-bottom: 0; }
  .num { font-family: var(--mono); text-align: right; }
  .scroll { overflow-x: auto; }
  .explorer { display: grid; grid-template-columns: 280px 1fr; gap: 14px; }
  @media (max-width: 860px) { .explorer { grid-template-columns: 1fr; } }
  .caselist { max-height: 560px; overflow-y: auto; }
  .caseitem { padding: 10px 13px; border-bottom: 1px solid var(--line);
              cursor: pointer; display: flex; justify-content: space-between;
              gap: 8px; align-items: center; }
  .caseitem:hover { background: var(--panel2); }
  .caseitem.sel { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
  .caseitem .id { font: 12px/1.3 var(--mono); }
  .caseitem .tag { flex: 0 0 auto; }
  .caseitem .fc { color: var(--muted); font-size: 10.5px; }
  .detail { padding: 18px 20px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
  .box { background: var(--panel2); border: 1px solid var(--line);
         border-radius: 6px; padding: 12px 14px; }
  .box h3 { margin: 0 0 9px; font-size: 11px; text-transform: uppercase;
            letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .kv { display: flex; justify-content: space-between; gap: 12px;
        font: 12px/1.7 var(--mono); }
  .kv span:first-child { color: var(--muted); }
  .check { display: flex; gap: 9px; padding: 6px 0;
           border-bottom: 1px dashed var(--line); font-size: 12.5px; }
  .check:last-child { border-bottom: 0; }
  .check .mark { font: 600 11px/1.5 var(--mono); flex: 0 0 42px; }
  .check.pass .mark { color: var(--ok); } .check.fail .mark { color: var(--bad); }
  .check .name { font: 12px/1.5 var(--mono); flex: 0 0 250px; }
  .check .why { color: var(--muted); font-size: 12px; }
  @media (max-width: 720px) { .check { flex-wrap: wrap; } .check .name { flex: 1 1 auto; } }
  .quote { border-left: 3px solid var(--line); padding: 2px 0 2px 12px;
           color: var(--muted); font-style: italic; }
  .banner { padding: 11px 15px; border-radius: 6px; font-size: 13px;
            background: #3a2a12; color: #e3b341; border: 1px solid #5c4415; }
  .adv { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 860px) { .adv { grid-template-columns: 1fr; } }
  .lede { color: var(--muted); max-width: 76ch; margin: 0 0 18px; }
  .win { color: var(--ok); font-weight: 600; }
  .neutral { color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line);
           padding-top: 16px; }
  code { font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap" id="app">Loading…</div>

<script>
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let STATE = null, SELECTED = null;
const SHORT = { MATCHED: 'matched', AUTO_RESOLVED: 'auto', RECOMMEND_REVIEW: 'confirm',
                HUMAN_REVIEW_REQUIRED: 'review', UNRESOLVED: 'open' };

function stat(k, v, cls) {
  return `<div class="card stat"><div class="k">${esc(k)}</div><div class="v ${cls||''}">${esc(v)}</div></div>`;
}

function overview(s) {
  const o = s.overview;
  return `<section>
    <h1>LedgerGuard</h1>
    <p class="lede">A self verifying AI finance controller. Deterministic reconciliation and an
      independent Shadow Ledger do the proving; AI investigates only what could not be proved;
      every AI hypothesis has to pass an Evidence Gate before a case can be closed.</p>
    ${s.provider_is_model ? '' : `<div class="banner" style="margin-bottom:16px">
      Investigator: <code>${esc(s.provider)}</code> — the offline stand-in, not a model.
      It is deliberately naive (it matches on amount and asks to resolve), so the Evidence Gate
      is being shown against the worst plausible investigator. Set <code>ANTHROPIC_API_KEY</code>
      and restart to run the Claude-backed investigator.</div>`}
    <div class="strip">
      ${stat('Records processed', o.records_processed)}
      ${stat('Value reconciled', 'INR ' + o.value_inr)}
      ${stat('Match rate', (o.match_rate * 100).toFixed(1) + '%')}
      ${stat('Auto resolved', o.auto_resolved, 'good')}
      ${stat('Sent to human', o.unresolved, 'warn')}
      ${stat('Unresolved value', 'INR ' + o.unresolved_value_inr, 'warn')}
      ${stat('False auto resolutions', o.false_auto_resolutions, o.false_auto_resolutions === 0 ? 'good' : 'warn')}
      ${stat('Throughput', o.throughput_per_second + '/s')}
    </div>
  </section>`;
}

function recordsBox(c) {
  const r = c.records;
  const row = (k, v) => `<div class="kv"><span>${esc(k)}</span><span>${esc(v)}</span></div>`;
  let h = '<div class="box"><h3>Source records</h3>';
  if (r.order) h += row('order', r.order.order_id) + row('customer', r.order.customer_reference)
                 + row('amount', 'INR ' + r.order.amount_inr);
  h += row('payment', r.payment.payment_id) + row('captured', (r.payment.captured_at||'').slice(0,16));
  if (r.settlement) {
    h += row('settlement', r.settlement.settlement_id)
       + row('settled on', r.settlement.settlement_date.slice(0,10))
       + row('refund adj', 'INR ' + r.settlement.refund_adjustments_inr);
  } else h += row('settlement', 'ABSENT');
  if (r.candidate_refunds && r.candidate_refunds.length) {
    h += '<div style="margin-top:9px"><h3>Candidate evidence (unproven)</h3>';
    r.candidate_refunds.forEach(cr => {
      h += row(cr.refund_id, 'INR ' + (cr.amount/100).toFixed(2)) + row('reference', cr.reference);
    });
    h += '</div>';
  }
  return h + '</div>';
}

function expectedBox(c) {
  const e = c.expected, s = c.records.settlement;
  const row = (k, a, b) => `<div class="kv"><span>${esc(k)}</span><span>${esc(a)}${b !== undefined ? '  →  ' + esc(b) : ''}</span></div>`;
  let h = '<div class="box"><h3>Shadow ledger expected vs observed</h3>';
  h += row('gross', e.gross_inr, s ? s.gross_inr : '—');
  h += row('fees', e.fees_inr, s ? s.fees_inr : '—');
  h += row('tax', e.tax_inr, s ? s.tax_inr : '—');
  h += row('refunds', e.refund_adjustments_inr, s ? s.refund_adjustments_inr : '—');
  h += row('NET', e.net_inr, s ? s.net_inr : 'no settlement');
  h += '<div style="margin-top:9px"></div>';
  c.invariants.forEach(i => {
    h += `<div class="check ${i.holds ? 'pass' : 'fail'}"><span class="mark">${i.holds ? 'HOLDS' : 'BREAK'}</span>` +
         `<span class="name">${esc(i.name)}</span></div>`;
  });
  return h + '</div>';
}

function investigationBox(c) {
  if (!c.investigation) {
    return `<div class="box"><h3>AI investigation</h3><div class="neutral">Not invoked.
      The deterministic engine proved this case on its own, so no model call was made.</div></div>`;
  }
  const i = c.investigation;
  return `<div class="box"><h3>AI investigation <span class="neutral">(${esc(i.source)})</span></h3>
    <div class="kv"><span>hypothesis</span><span>${esc(i.hypothesis)}</span></div>
    <div class="kv"><span>asks to</span><span>${esc(i.recommended_action)}</span></div>
    <div class="quote" style="margin-top:9px">${esc(i.reason)}</div>
    <div class="neutral" style="margin-top:9px;font-size:12px">The investigator proposes. It cannot
      do arithmetic, edit a record, or close a case.</div></div>`;
}

function gateBox(c) {
  if (!c.verification) {
    return `<div class="box"><h3>Evidence Gate</h3><div class="neutral">Not required.</div></div>`;
  }
  const v = c.verification;
  let h = `<div class="box"><h3>Evidence Gate</h3>
    <div style="margin-bottom:9px"><span class="tag ${esc(v.verdict)}">${esc(v.verdict)}</span>
    <span class="neutral" style="margin-left:8px">${esc(v.verification_score)}</span></div>`;
  if (!v.checks.length) h += `<div class="neutral">${esc(v.note || 'no checks were possible')}</div>`;
  v.checks.forEach(ch => {
    h += `<div class="check ${ch.passed ? 'pass' : 'fail'}"><span class="mark">${ch.passed ? 'PASS' : 'FAIL'}</span>` +
         `<span class="name">${esc(ch.name)}</span><span class="why">${esc(ch.detail)}</span></div>`;
  });
  if (v.note) h += `<div class="neutral" style="margin-top:9px">${esc(v.note)}</div>`;
  return h + '</div>';
}

function decisionBox(c) {
  if (!c.decision) {
    return `<div class="box"><h3>Decision</h3><span class="tag MATCHED">MATCHED</span>
      <div class="neutral" style="margin-top:8px">Reconciled exactly. No exception, no AI, no human.</div></div>`;
  }
  const d = c.decision;
  return `<div class="box"><h3>Decision</h3>
    <span class="tag ${esc(d.state)}">${esc(d.state)}</span>
    <div style="margin-top:9px">${esc(d.reason)}</div>
    ${d.missing_evidence && d.missing_evidence.length
      ? `<div class="neutral" style="margin-top:8px">Missing: ${esc(d.missing_evidence.join(', '))}</div>` : ''}
    <div class="neutral" style="margin-top:8px">Next: ${esc(d.suggested_action)}</div></div>`;
}

function renderDetail() {
  const c = STATE.cases.find(x => x.case_id === SELECTED);
  const el = document.getElementById('detail');
  if (!c) { el.innerHTML = '<div class="neutral">Select a case.</div>'; return; }
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">
      <div><code>${esc(c.case_id)}</code>
        <span class="neutral" style="margin-left:8px">${esc(c.exception_type || 'reconciled')}</span></div>
      <div><span class="tag ${esc(c.state)}">${esc(c.state)}</span></div>
    </div>
    <div class="grid2">${recordsBox(c)}${expectedBox(c)}</div>
    <div class="grid2" style="margin-top:14px">${investigationBox(c)}${gateBox(c)}</div>
    <div style="margin-top:14px">${decisionBox(c)}</div>`;
}

function explorer(s) {
  const demo = new Set(s.demo_cases);
  const rank = (id) => { const i = s.demo_cases.indexOf(id); return i === -1 ? 999 : i; };
  const ordered = [...s.cases].sort((a, b) => {
    const ra = rank(a.case_id), rb = rank(b.case_id);
    if (ra !== rb) return ra - rb;
    return a.case_id.localeCompare(b.case_id);
  });
  const items = ordered.map(c => `<div class="caseitem" data-id="${esc(c.case_id)}">
      <div><div class="id">${esc(c.case_id)}</div>
           <div class="fc">${demo.has(c.case_id) ? '★ ' : ''}${esc(c.fault_class)}</div></div>
      <span class="tag ${esc(c.state)}">${esc(SHORT[c.state] || c.state)}</span></div>`).join('');
  return `<section><h2>Case explorer</h2>
    <p class="lede">Starred cases are the prepared demo path: a clean reconciliation, a fee
      mismatch the arithmetic proves outright, an ambiguous refund the Evidence Gate verifies,
      the wrong-linkage case it rejects, and a missing settlement nobody can close.</p>
    <div class="explorer">
      <div class="card caselist" id="caselist">${items}</div>
      <div class="card detail" id="detail"></div>
    </div></section>`;
}

function adversarial(s) {
  const a = s.adversarial;
  const panel = (k, t, sub) => {
    const d = a[k];
    return `<div class="card" style="padding:16px 18px">
      <h3 style="margin:0 0 4px;font-size:13px">${esc(t)}</h3>
      <div class="neutral" style="font-size:12px;margin-bottom:11px">${esc(sub)}</div>
      <div class="kv"><span>customer</span><span>${esc(d.customer)}</span></div>
      <div class="kv"><span>shortfall</span><span>INR ${esc(d.shortfall_inr)}</span></div>
      <div style="margin:11px 0 4px"><span class="neutral" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em">AI says</span></div>
      <div><code>${esc(d.hypothesis)}</code> → asks to <code>${esc(d.recommended_action)}</code></div>
      <div class="quote" style="margin:8px 0 12px">${esc(d.ai_reason)}</div>
      <div><span class="tag ${esc(d.verdict)}">${esc(d.verdict)}</span>
           <span class="neutral" style="margin-left:8px">${esc(d.verification_score)}</span></div>
      <div style="margin-top:10px">${d.checks.map(c =>
        `<div class="check ${c.passed ? 'pass' : 'fail'}"><span class="mark">${c.passed ? 'PASS' : 'FAIL'}</span>
         <span class="name">${esc(c.name)}</span></div>`).join('')}</div>
      <div style="margin-top:12px"><span class="tag ${esc(d.state)}">${esc(d.state)}</span></div>
      <div class="neutral" style="margin-top:8px;font-size:12px">${esc(d.decision_reason)}</div>
    </div>`;
  };
  const n = a.naive && a.naive.victim;
  const naivePanel = !n ? '' : `<div class="card" style="padding:16px 18px;margin-top:14px">
      <h3 style="margin:0 0 4px;font-size:13px">Payment A again, with a naive investigator
        <span class="neutral">(heuristic_stub)</span></h3>
      <div class="neutral" style="font-size:12px;margin-bottom:11px">
        The live investigator is <code>${esc(a.investigator)}</code>. A capable model sometimes
        declines this case on its own — a good outcome, and exactly the outcome the gate exists
        so the system does not have to depend on. Here is the same case handed to an
        investigator that reliably gets it wrong.</div>
      <div><code>${esc(n.hypothesis)}</code> → asks to <code>${esc(n.recommended_action)}</code></div>
      <div style="margin:10px 0"><span class="tag ${esc(n.verdict)}">${esc(n.verdict)}</span>
        <span class="neutral" style="margin-left:8px">${esc(n.verification_score)}</span></div>
      <div>${n.checks.map(c => `<div class="check ${c.passed ? 'pass' : 'fail'}">
        <span class="mark">${c.passed ? 'PASS' : 'FAIL'}</span>
        <span class="name">${esc(c.name)}</span>
        <span class="why">${esc(c.detail)}</span></div>`).join('')}</div>
      <div style="margin-top:12px"><span class="tag ${esc(n.state)}">${esc(n.state)}</span></div>
    </div>`;
  return `<section><h2>The adversarial case</h2>
    <p class="lede">Two payments are short by exactly the same amount. One refund exists that
      could explain either of them, and applying it makes the shadow ledger balance in
      <em>both</em> cases. Arithmetic cannot separate them. Only the customer linkage can.</p>
    <div class="adv">
      ${panel('donor', 'Payment B — genuinely explained', 'Its own refund lost its linkage during ingestion.')}
      ${panel('victim', 'Payment A — plausible but wrong', 'Nothing in the system actually explains this deduction.')}
    </div>
    ${naivePanel}
    <p class="lede" style="margin-top:14px">For Payment A the amount matches exactly and the
      ledger balances — both checks pass — and the case is still refused, because the refund
      belongs to a different customer. <strong>The gate rejects on linkage, not on amount.</strong>
      On the six generated wrong-linkage cases in the benchmark, the live model asked to resolve
      <em>all six</em>, and the gate rejected all six.</p>
  </section>`;
}

function benchmark(s) {
  const b = s.benchmark.baseline, h = s.benchmark.hybrid;
  const rows = [
    ['Total cases', b.total_cases, h.total_cases],
    ['Match rate', (b.match_rate*100).toFixed(1)+'%', (h.match_rate*100).toFixed(1)+'%'],
    ['Exceptions raised', b.exceptions, h.exceptions],
    ['False exceptions', b.false_exceptions, h.false_exceptions],
    ['Disposition accuracy', (b.accuracy*100).toFixed(1)+'%', (h.accuracy*100).toFixed(1)+'%', 'win'],
    ['Exceptions correctly resolved', b.exceptions_correctly_resolved, h.exceptions_correctly_resolved, 'win'],
    ['Exceptions incorrectly resolved', b.exceptions_incorrectly_resolved, h.exceptions_incorrectly_resolved],
    ['Correct abstentions', b.correct_abstentions, h.correct_abstentions],
    ['Unnecessary abstentions', b.unnecessary_abstentions, h.unnecessary_abstentions, 'win'],
    ['Value left unresolved', 'INR '+b.unresolved_value_inr, 'INR '+h.unresolved_value_inr],
    ['False auto resolutions', b.false_auto_resolutions, h.false_auto_resolutions],
    ['Value falsely auto resolved', 'INR '+b.false_auto_resolved_value_inr, 'INR '+h.false_auto_resolved_value_inr],
    ['Investigations run', b.investigations, h.investigations],
  ];
  return `<section><h2>Benchmark — rules only vs LedgerGuard</h2>
    <p class="lede">Same frozen holdout (${s.dataset.lifecycles} lifecycles, seed
      <code>${esc(s.dataset.seed)}</code>, batch <code>${esc(s.dataset.batch_sha256)}</code>), same
      deterministic engine, same safety gate. The only difference is whether the investigation step
      runs. Every figure is computed by <code>python -m ledgerguard.evaluation.benchmark</code>.</p>
    <div class="card scroll"><table>
      <thead><tr><th>Metric</th><th class="num">Rules only</th><th class="num">LedgerGuard</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r[0])}</td><td class="num">${esc(r[1])}</td>
        <td class="num ${r[3]==='win'?'win':''}">${esc(r[2])}</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="lede" style="margin-top:12px">The hybrid closes the ambiguous refund cases the
      baseline had to escalate, and gives up none of the baseline's safety: false auto
      resolutions stay at zero and every wrong-linkage case stays escalated.</p>
    ${s.provider_is_model ? `<p class="lede">These figures come from <em>this server's own run</em>
      at startup. Model output is not reproducible — repeated runs on the identical frozen holdout
      resolve different numbers of ambiguous cases, so this table will not match
      <code>evaluation/outputs/benchmark.md</code> figure for figure. What does not move between
      runs: false auto resolutions stay at zero, and every wrong-linkage case stays escalated. The
      deterministic layer is the reproducible part; the model only moves recall.</p>` : ''}
  </section>`;
}

function unresolved(s) {
  return `<section><h2>What LedgerGuard could not close</h2>
    <p class="lede">${s.unresolved.length} of ${s.overview.records_processed} cases, INR
      ${esc(s.overview.unresolved_value_inr)} of exposure. Abstention is a designed outcome, not
      a failure — every row says exactly what evidence was missing.</p>
    <div class="card scroll"><table>
      <thead><tr><th>Case</th><th>Exception</th><th class="num">Exposure</th>
        <th>Blocked because</th><th>Suggested action</th></tr></thead>
      <tbody>${s.unresolved.map(u => `<tr>
        <td><code>${esc(u.case_id)}</code></td>
        <td>${esc((u.exception_type||'').replace('EXCEPTION_',''))}</td>
        <td class="num">INR ${esc(u.exposure_inr)}</td>
        <td class="why">${esc(u.blocked_because)}</td>
        <td class="why">${esc(u.suggested_action)}</td></tr>`).join('')}</tbody>
    </table></div></section>`;
}

fetch('/api/state').then(r => r.json()).then(s => {
  STATE = s;
  SELECTED = s.demo_cases[0] || (s.cases[0] && s.cases[0].case_id);
  document.getElementById('app').innerHTML =
    overview(s) + explorer(s) + adversarial(s) + benchmark(s) + unresolved(s) +
    `<footer>Dataset: seed <code>${esc(s.dataset.seed)}</code>, generator
      <code>${esc(s.dataset.generator_version)}</code>, ${esc(s.dataset.split)},
      ${esc(s.dataset.lifecycles)} lifecycles, batch SHA-256 <code>${esc(s.dataset.batch_sha256)}</code>.
      Investigator: <code>${esc(s.provider)}</code>. Ground truth is hidden from the controller and
      used only for scoring. Auto resolved means a reconciliation exception was classified and
      closed inside LedgerGuard; no money is ever moved.</footer>`;
  document.getElementById('caselist').addEventListener('click', e => {
    const item = e.target.closest('.caseitem');
    if (!item) return;
    SELECTED = item.dataset.id;
    document.querySelectorAll('.caseitem').forEach(n => n.classList.toggle('sel', n.dataset.id === SELECTED));
    renderDetail();
  });
  document.querySelectorAll('.caseitem').forEach(n => n.classList.toggle('sel', n.dataset.id === SELECTED));
  renderDetail();
}).catch(e => {
  document.getElementById('app').innerHTML =
    '<div class="banner">Could not load /api/state: ' + esc(e.message) + '</div>';
});
